<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pc-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#657565" />
      <stop offset="100%" stop-color="#252B28" />
    </linearGradient>
    <linearGradient id="pc-gold" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4BD92" />
      <stop offset="100%" stop-color="#B49A70" />
    </linearGradient>
  </defs>

  <!-- Outer rounded estate badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pc-bg)" stroke="url(#pc-gold)" stroke-width="2" />

  <!-- Blockchain hexagonal seal -->
  <polygon
    points="32,10 51,21 51,43 32,54 13,43 13,21"
    stroke="url(#pc-gold)"
    stroke-width="2.2"
    stroke-linejoin="round"
    fill="#1E2320"
    fill-opacity="0.35"
  />

  <!-- Architectural roof gable & tower fill -->
  <path
    d="M21 31 L32 20 L43 31 V43 H21 V31 Z"
    fill="#FAF8F3"
    fill-opacity="0.16"
  />

  <!-- Crisp estate roofline -->
  <path
    d="M19 31.5 L32 19 L45 31.5"
    stroke="#FAF8F3"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Vertical architectural pillars & keystone portal -->
  <path
    d="M23.5 29.5 V43 M40.5 29.5 V43 M29.5 43 V34.5 H34.5 V43"
    stroke="#FAF8F3"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Gold keystone diamond in pediment -->
  <polygon points="32,24.5 34.8,27.3 32,30.1 29.2,27.3" fill="url(#pc-gold)" />

  <!-- Ledger baseline + chain nodes -->
  <line x1="18" y1="43" x2="46" y2="43" stroke="#FAF8F3" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="17.5" cy="43" r="2.2" fill="url(#pc-gold)" />
  <circle cx="46.5" cy="43" r="2.2" fill="url(#pc-gold)" />
</svg>
