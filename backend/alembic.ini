# PropChain Alembic Configuration
# Database migrations for PostgreSQL with psycopg 3

[alembic]
# Path to migration scripts
script_location = migrations

# Migration file naming template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Fallback sqlalchemy URL; dynamically overridden by migrations/env.py from app.core.config
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/propchain

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
